<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Gallery | Hair Magician Unisex Salon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #0F0F0F; color: #FAF9F6; scroll-behavior: smooth; }
    .font-premium { font-family: 'Cinzel', serif; }
    .text-gold { color: #D4AF37; }
    .bg-gold-gradient { background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%); }
    .premium-transition { transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
    .nav-link-effect { position: relative; }
    .nav-link-effect::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background-color: #D4AF37; transition: width 0.3s ease; }
    .nav-link-effect:hover::after { width: 100%; }
  </style>
</head>
<body class="overflow-x-hidden pt-24 md:pt-28">

  <!-- HEADER / NAVIGATION -->
  <header class="fixed top-0 left-0 w-full z-50 bg-black/90 border-b border-zinc-900/80 backdrop-blur-xl premium-transition">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
      <a href="index.html" class="flex items-center group">
        <div class="w-16 h-16 rounded-full overflow-hidden border border-gold/30 flex items-center justify-center bg-zinc-950 shadow-[0_0_15px_rgba(212,175,55,0.05)] group-hover:border-gold/80 group-hover:shadow-[0_0_20px_rgba(212,175,55,0.2)] premium-transition transform group-hover:scale-105">
          <img src="logo.png" alt="Hair Magician" class="w-full h-full object-cover">
        </div>
      </a>
      <nav class="hidden lg:flex items-center space-x-8 text-xs uppercase tracking-widest font-medium">
        <a href="index.html" class="text-zinc-400 hover:text-gold nav-link-effect premium-transition">Home</a>
        <a href="about.html" class="text-zinc-400 hover:text-gold nav-link-effect premium-transition">About</a>
        <a href="services.html" class="text-zinc-400 hover:text-gold nav-link-effect premium-transition">Services</a>
        <a href="gallery.html" class="text-gold nav-link-effect premium-transition">Gallery</a>
        <a href="pricing.html" class="text-zinc-400 hover:text-gold nav-link-effect premium-transition">Pricing</a>
        <a href="index.html#booking" class="text-zinc-400 hover:text-gold nav-link-effect premium-transition">Book Appointment</a>
        <a href="index.html#contact" class="text-zinc-400 hover:text-gold nav-link-effect premium-transition">Contact</a>
      </nav>
      <div class="hidden sm:flex items-center space-x-6">
        <a href="tel:+919100325489" class="text-zinc-400 hover:text-gold premium-transition text-xs font-semibold flex items-center space-x-2">
          <span class="text-gold text-sm">📞</span><span class="tracking-wider">+91 9100325489</span>
        </a>
        <a href="index.html#booking" class="bg-gold-gradient text-black font-bold uppercase text-xs tracking-widest px-6 py-3 rounded-sm hover:opacity-90 shadow-[0_4px_20px_rgba(176,135,40,0.15)] hover:shadow-[0_4px_25px_rgba(176,135,40,0.35)] transform hover:-translate-y-0.5 premium-transition">Book Now</a>
      </div>
    </div>
  </header>

  <!-- MASONRY GALLERY SHOWCASE CONTAINER -->
  <section class="py-24 px-4 max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
    <div data-aos="zoom-in" class="relative group h-80 overflow-hidden border border-zinc-900 rounded-sm shadow-xl hover:border-gold/40 hover:shadow-[0_0_25px_rgba(212,175,55,0.12)] premium-transition">
      <img src="https://images.unsplash.com/photo-1562322140-8baeececf3df?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover premium-transition group-hover:scale-105 filter brightness-90 group-hover:brightness-75" alt="Highlights">
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 premium-transition flex flex-col justify-end p-6">
        <span class="text-gold text-[10px] uppercase tracking-widest block mb-1">Hair Studio</span>
        <h4 class="text-white font-premium text-md transform translate-y-2 group-hover:translate-y-0 premium-transition">Couture Highlights</h4>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>AOS.init({ duration: 1000, once: true });</script>
</body>
</html>
