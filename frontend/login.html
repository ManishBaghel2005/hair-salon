<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Hair Magician Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #0F0F0F; color: #FAF9F6; }
    .font-premium { font-family: 'Cinzel', serif; }
    .text-gold { color: #D4AF37; }
    .bg-gold-gradient { background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

  <div class="w-full max-w-md bg-zinc-950 border border-zinc-800 p-8 rounded-sm shadow-2xl">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-premium text-gold tracking-widest uppercase">Hair Magician</h1>
      <p class="text-xs text-zinc-500 tracking-wider mt-1">Management Portal Authentication</p>
    </div>

    <!-- Error Alert Banner (Hidden by default) -->
    <div id="errorMessage" class="hidden mb-4 p-3 bg-red-950/40 border border-red-900 text-red-400 text-xs rounded-sm">
      Invalid username or password configuration.
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-6">
      <div>
        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Username</label>
        <input type="text" id="username" required autocomplete="username"
               class="w-full bg-zinc-900 border border-zinc-800 rounded-sm p-3 text-sm text-white outline-none focus:border-gold transition">
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
               class="w-full bg-zinc-900 border border-zinc-800 rounded-sm p-3 text-sm text-white outline-none focus:border-gold transition">
      </div>

      <button type="submit" 
              class="w-full bg-gold-gradient text-black font-bold uppercase tracking-widest text-xs py-3.5 rounded-sm hover:scale-[1.01] active:scale-[0.99] transition transform">
        Verify Credentials
      </button>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      try {
        // Backend API verification endpoint execution (Flask ya Node context)
        // Note: Yahan API_URL aapki config.js se aayega (e.g., http://localhost:5000)
       // login.html ke fetch logic me ye update kar dena:
const response = await fetch(CONFIG.LOGIN_URL, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ username, password })
});

        const data = await response.json();

        if (response.ok && data.token) {
          // Token standard local storage pipelines me initialize kar rahe hain
          localStorage.setItem('adminToken', data.token);
          window.location.href = 'admin.html';
        } else {
          errorDiv.textContent = data.message || 'Authentication mismatch.';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Server connectivity lost. Try again.';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
